name: AI Tech Radar

on:
  schedule:
    - cron: "0 23 * * 0"  # 毎週日曜 UTC 23:00 = 毎週月曜 JST 08:00
  workflow_dispatch:

jobs:
  send-digest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-tech-radar
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ai-tech-radar/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send digest
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          LOOKBACK_HOURS: "168"
        run: python main.py
