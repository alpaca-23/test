<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>朝夕ニュース | 政治・経済・AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700;900&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <div class="brand">
        <h1 class="brand-title">朝夕ニュース</h1>
        <p class="brand-sub">政治・経済・AI を、朝と夕に。</p>
      </div>
      <div class="date-block">
        <div class="today" id="today"></div>
        <div class="edition-badge" id="edition-badge">朝刊</div>
      </div>
    </div>
  </header>

  <nav class="edition-nav" aria-label="版の切り替え">
    <button class="edition-btn" data-edition="morning" type="button">
      <span class="edition-icon" aria-hidden="true">☀</span>
      <span class="edition-label">朝刊</span>
      <span class="edition-time">5:00 – 14:00</span>
    </button>
    <button class="edition-btn" data-edition="evening" type="button">
      <span class="edition-icon" aria-hidden="true">☾</span>
      <span class="edition-label">夕刊</span>
      <span class="edition-time">14:00 – 翌5:00</span>
    </button>
  </nav>

  <nav class="category-nav" aria-label="カテゴリーの切り替え">
    <button class="cat-btn active" data-category="politics" type="button">政治</button>
    <button class="cat-btn" data-category="economics" type="button">経済</button>
    <button class="cat-btn" data-category="ai" type="button">AI</button>
  </nav>

  <main class="content">
    <section class="lead-wrap" id="lead-wrap" aria-live="polite"></section>
    <section class="news-list" id="news-list" aria-live="polite"></section>
    <div class="status" id="status"></div>
  </main>

  <footer class="site-footer">
    <button class="refresh-btn" id="refresh-btn" type="button">最新の記事を取得</button>
    <p class="source-note" id="source-note">出典: Google ニュース（無料記事を集約）</p>
    <p class="copy">© 朝夕ニュース</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
